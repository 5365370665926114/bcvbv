<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" width="720" height="1100">
  <defs>
    <filter id="crimsonRim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="eyeFlare" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="g1" />
      <feGaussianBlur stdDeviation="11" result="g2" />
      <feMerge>
        <feMergeNode in="g2" />
        <feMergeNode in="g1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="suitBase" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#111116" />
      <stop offset="45%" stop-color="#060609" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>
    <linearGradient id="shirtTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7" />
      <stop offset="100%" stop-color="#D4D4DC" />
    </linearGradient>
    <linearGradient id="handTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEFF4" />
      <stop offset="65%" stop-color="#C2C2CC" />
      <stop offset="100%" stop-color="#6B6B76" />
    </linearGradient>
  </defs>

  <!-- Unified Exact-Fit Outer Crimson Neon Silhouette Glow -->
  <g filter="url(#crimsonRim)">
    <path
      d="M 360 98
         C 408 96, 448 122, 462 168
         C 474 208, 466 248, 444 268
         C 440 304, 424 342, 404 366
         L 414 402
         C 496 424, 578 460, 616 524
         C 652 586, 668 695, 678 825
         L 692 1098
         L 32 1098
         L 48 815
         C 58 688, 76 582, 114 522
         C 152 460, 232 424, 310 402
         L 320 366
         C 298 342, 282 304, 278 268
         C 256 248, 248 208, 260 168
         C 274 122, 312 96, 360 98 Z"
      fill="#030305"
      stroke="#FF1414"
      stroke-width="4.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Suit Body Silhouette (Sharp Tailored Shoulders) -->
  <path
    d="M 416 404
       C 496 426, 576 462, 614 524
       C 650 586, 666 695, 676 825
       L 690 1100
       L 34 1100
       L 50 815
       C 60 688, 78 582, 116 522
       C 154 462, 232 426, 308 404
       L 362 430 Z"
    fill="url(#suitBase)"
  />

  <!-- Crisp Subtle Suit Seam Lines & Shoulder Creases -->
  <path d="M 152 520 C 134 620, 128 730, 146 840" fill="none" stroke="#1E1E27" stroke-width="2.5" />
  <path d="M 578 525 C 594 635, 602 745, 596 865" fill="none" stroke="#1B1B24" stroke-width="2.5" />

  <!-- Left Forearm Crossed Over Chest -->
  <path
    d="M 118 532
       C 94 620, 90 738, 112 856
       C 128 932, 184 962, 262 924
       L 398 830
       L 366 742
       L 230 794
       C 208 738, 206 654, 222 574 Z"
    fill="#07070A"
    stroke="#262632"
    stroke-width="2.4"
  />
  <!-- White Dress Shirt Cuff -->
  <path d="M 350 744 L 386 724 L 416 816 L 378 838 Z" fill="#EAEAF0" stroke="#0B0B0E" stroke-width="3" />

  <!-- White Dress Shirt V -->
  <polygon
    points="304,404 362,434 420,404 402,592 362,672 322,592"
    fill="url(#shirtTone)"
    stroke="#101016"
    stroke-width="2.2"
  />

  <!-- Crisp Collar Wings -->
  <polygon points="308,396 356,448 326,478 294,428" fill="#F8F8FA" stroke="#09090D" stroke-width="2.6" />
  <polygon points="416,396 368,448 398,478 430,428" fill="#EBEBF2" stroke="#09090D" stroke-width="2.6" />

  <!-- Slim Black Necktie -->
  <polygon points="350,444 374,444 370,478 354,478" fill="#0A0A0E" stroke="#24242E" stroke-width="1.5" />
  <polygon points="354,478 370,478 384,650 362,688 340,650" fill="#07070B" stroke="#22222C" stroke-width="1.5" />

  <!-- Tailored Suit Peak Lapels -->
  <path
    d="M 296 404 L 246 472 L 274 510 L 254 536 L 348 702 L 328 594 L 304 416 Z"
    fill="#0F0F15"
    stroke="#2E2E3A"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <path
    d="M 428 404 L 478 472 L 450 510 L 470 536 L 376 702 L 396 594 L 420 416 Z"
    fill="#0D0D13"
    stroke="#2E2E3A"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Subtle Crimson Lapel Rim -->
  <path d="M 294 406 L 246 472 L 274 510" fill="none" stroke="#FF2222" stroke-width="1.8" opacity="0.78" />
  <path d="M 430 406 L 478 472 L 450 510" fill="none" stroke="#FF2222" stroke-width="1.8" opacity="0.78" />

  <!-- Breast Pocket & Crimson Silk Sliver -->
  <polygon points="444,568 518,580 514,592 440,580" fill="#15151D" stroke="#2D2D3A" stroke-width="1.8" />
  <polygon points="454,568 490,554 508,576" fill="#D40E0E" />

  <!-- Center Jacket Seam & Matte Buttons -->
  <line x1="362" y1="698" x2="362" y2="1096" stroke="#1E1E28" stroke-width="2.6" />
  <circle cx="382" cy="836" r="7.5" fill="#14141C" stroke="#3A3A48" stroke-width="2" />
  <circle cx="382" cy="928" r="7.5" fill="#14141C" stroke="#3A3A48" stroke-width="2" />

  <!-- Hand Raised Dramatically Over Chest (Sleek Manga Proportions) -->
  <g stroke="#0A0A0E" stroke-width="2.6" stroke-linejoin="round">
    <path d="M 382 728 C 408 702, 452 686, 480 698 C 492 722, 474 768, 438 796 L 404 814 Z" fill="url(#handTone)" />
    <!-- Thumb -->
    <path d="M 392 718 L 414 662 C 419 652, 432 656, 428 668 L 412 720 Z" fill="url(#handTone)" />
    <!-- Index -->
    <path d="M 416 706 L 464 632 C 470 624, 482 631, 476 641 L 438 708 Z" fill="url(#handTone)" />
    <!-- Middle -->
    <path d="M 440 712 L 504 650 C 511 643, 522 652, 515 662 L 458 726 Z" fill="url(#handTone)" />
    <!-- Ring -->
    <path d="M 458 730 L 522 684 C 530 678, 539 688, 531 698 L 468 750 Z" fill="url(#handTone)" />
    <!-- Pinky -->
    <path d="M 462 756 L 514 726 C 522 722, 528 732, 520 740 L 464 776 Z" fill="url(#handTone)" />
    <!-- Subtle Knuckle/Tendon Ink Lines -->
    <path d="M 416 742 L 456 716 M 426 762 L 466 736" stroke="#7A7A88" stroke-width="1.5" opacity="0.65" />
  </g>

  <!-- Neck & Chin Shadow -->
  <path d="M 322 354 L 402 354 L 412 408 L 362 438 L 312 408 Z" fill="#050508" />

  <!-- Deep Shadowed Noir Face -->
  <path
    d="M 282 228
       C 280 158, 314 118, 362 118
       C 410 118, 444 158, 442 228
       C 440 284, 424 334, 400 364
       C 386 382, 372 390, 362 390
       C 352 390, 338 382, 324 364
       C 300 334, 284 284, 282 228 Z"
    fill="#030305"
  />

  <!-- Sleek Swept Manga Hair with Natural Forehead Part -->
  <path
    d="M 278 266
       C 254 244, 248 202, 260 162
       C 276 116, 314 96, 362 96
       C 412 96, 450 118, 464 164
       C 476 204, 468 244, 444 266
       L 436 220
       C 434 188, 418 164, 396 154
       C 394 176, 386 198, 374 214
       C 372 192, 366 172, 356 156
       C 344 176, 330 198, 314 216
       C 314 196, 312 178, 306 164
       C 290 180, 282 204, 282 232 Z"
    fill="#060609"
    stroke="#1E1014"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Subtle Hair Gloss Lines -->
  <path d="M 308 118 C 342 106, 382 106, 416 120" fill="none" stroke="#2C1418" stroke-width="2.5" />
  <path d="M 284 150 C 304 134, 328 128, 352 128" fill="none" stroke="#281216" stroke-width="2" />

  <!-- Piercing Narrow Glowing Crimson Eyes -->
  <g filter="url(#eyeFlare)">
    <!-- Left Eye -->
    <path d="M 304 248 Q 325 239 346 250 Q 326 257 304 248 Z" fill="#FF1212" />
    <ellipse cx="326" cy="248" rx="4.5" ry="3.2" fill="#FFD4D4" />
    <circle cx="326" cy="248" r="1.8" fill="#FFFFFF" />
    <!-- Right Eye -->
    <path d="M 378 250 Q 399 239 420 248 Q 398 257 378 250 Z" fill="#FF1212" />
    <ellipse cx="398" cy="248" rx="4.5" ry="3.2" fill="#FFD4D4" />
    <circle cx="398" cy="248" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Crisp Crimson Neon Rim Highlight Tracing Shoulders & Hairline -->
  <path
    d="M 278 264 C 256 244, 250 206, 260 168 C 274 122, 312 98, 362 98 C 412 98, 448 122, 462 168 C 472 206, 466 244, 444 264"
    fill="none"
    stroke="#FF2424"
    stroke-width="2.4"
    opacity="0.9"
  />
  <path
    d="M 116 520 C 154 462, 230 426, 306 404"
    fill="none"
    stroke="#FF2424"
    stroke-width="2.6"
    opacity="0.88"
  />
  <path
    d="M 612 522 C 574 462, 496 426, 418 404"
    fill="none"
    stroke="#FF2424"
    stroke-width="2.6"
    opacity="0.88"
  />
</svg>
